repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -   id: trailing-whitespace
  -   id: end-of-file-fixer
  -   id: check-yaml
  -   id: check-added-large-files

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.6 # Replace with the latest Ruff version
  hooks:
    - id: ruff-check
      args: [--fix, --exit-non-zero-on-fix] # Optional: automatically fix issues and fail if fixes are applied
    - id: ruff-format # Optional: add if you want to use Ruff's formatter

- repo: https://github.com/econchick/interrogate # Check for >10% missing docstrings
  rev: 1.7.0
  hooks:
    - id: interrogate
      args: [--fail-under=90, --ignore-init-module, --ignore-private, --ignore-magic]
      pass_filenames: false
